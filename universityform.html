<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
    <form>
        <header>
    <h1>KIET registration</h1>
    </header>
    <lable for = "name">Name :</lable>
        <input type = "text"
            id ="name"
            name = "Student name"
            placeholder="Enter your name">
            <br>
            <br>
            
            <lable for = "email">E-mail :</lable>
            <input type = "email"
                id ="email"
                name = "Student email"
                placeholder="Enter your email">
                
                <br>
                <br>

                <lable for = "number">Mobile number :</lable>
        <input type = "number"
            id ="number"
            name = "Student number"
            placeholder="Mobile number">
            <br>
            <br>
            
            <lable for = "age">Age :</lable>
            <input type = "number"
            id ="age"
            name = "Student age"
            placeholder="Enter your age">
            <br>
            <br>
            <lable for = "dob">Date of birth :</lable>
            <input type = "date"
            id ="dob"
            name = "Student dob"
            placeholder="Enter your dob">
            <br><br>
            <lable for = "caste">caste</lable>
            <select id ="caste" name = "caste" >
                <option>GENERAL</option>
                <option>GENERAL-EWS</option>
                <option>OBC</option>
                <option>SC</option>
                <option>ST</option>
                <option>OTHERS</option>
            </select>
            <br><br>
            <br>
            <br>
            <lable for ="number">class 12 percentage :</lable>
            <input type = "number"
            id ="number"
            name = "student number"
            placeholder="Enter your percentage">
            <br>
            <br>
            <lable for ="number">Physics marks :</lable>
            <input type = "number"
            id ="number"
            name = "student number"
            placeholder="Enter your Physics marks">
            <br>
            <br>
            <lable for ="number">chemsitry marks:</lable>
            <input type = "number"
            id ="number"
            name = "student number"
            placeholder="Enter your chemsitry marks">
            <br>
            <br>
            <lable for ="number">Mathamatics marks:</lable>
            <input type = "number"
            id ="number"
            name = "student number"
            placeholder="Enter your Mathamatics marks">
            <br>
            <br>
            <lable for ="number">English marks:</lable>
            <input type = "number"
            id ="number"
            name = "student number"
            placeholder="Enter your English marks">
            <br>
            <br>
            



            <lable for = "exam">Entrance exam :</lable>
            <select id ="exam" name = "Entrance Exam" >
                <option>JEE</option>
                <option>CUET-UG</option>
                <option>KEE</option>
            </select>
            <br><br>
            <lable for = "courses">courses :</lable>
            <select id ="courses" name = "courses" >
                <option>B.TECH</option>
                <option>M.TECH</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>
            <br><br>
            <input type="submit" value="register">
    </form>
    </main>
</body>
</html>
